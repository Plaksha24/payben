<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payben - Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #f4f6f9; }
  .balance-card { background: linear-gradient(135deg, #4e54c8, #8f94fb); color: white; border-radius: 16px; }
</style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
  <span class="navbar-brand">💳 Payben</span>
  <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
</nav>

<div class="container mt-5" style="max-width: 500px;">

  <div class="card balance-card shadow p-4 mb-4 text-center">
    <div class="small">Wallet Balance</div>
    <h1 id="balanceAmount">₹0</h1>
  </div>

  <div class="card shadow p-4 mb-4">
    <h5 class="mb-3">Recharge Wallet</h5>
    <div class="input-group mb-3">
      <span class="input-group-text">₹</span>
      <input type="number" id="rechargeAmount" class="form-control" placeholder="Enter amount">
    </div>
    <button class="btn btn-primary w-100" onclick="rechargeNow()">Recharge Now</button>
    <div id="rechargeMsg" class="text-danger mt-2 small"></div>
  </div>

  <div class="card shadow p-4">
    <h5 class="mb-3">Transaction History</h5>
    <table class="table table-sm">
      <thead>
        <tr><th>Date</th><th>Amount</th><th>Status</th></tr>
      </thead>
      <tbody id="txnTableBody">
        <tr><td colspan="3" class="text-muted">Loading...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const API = "http://localhost:8000";
let userId = null;

async function init() {
  const params = new URLSearchParams(window.location.search);
  const email = params.get('email');
  if (!email) { window.location.href = 'index.html'; return; }

  userId = localStorage.getItem('user_id');
  if (!userId) { window.location.href = 'index.html'; return; }

  loadBalance();
  loadTransactions();
}

async function loadBalance() {
  try {
    const res = await fetch(`${API}/wallet/balance/${userId}`);
    const data = await res.json();
    document.getElementById('balanceAmount').innerText = '₹' + data.balance;
  } catch (err) {
    console.error(err);
  }
}

async function loadTransactions() {
  const tbody = document.getElementById('txnTableBody');
  try {
    const res = await fetch(`${API}/wallet/transactions/${userId}`);
    const data = await res.json();

    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" class="text-muted">No transactions yet</td></tr>';
      return;
    }

    tbody.innerHTML = data.map(t => `
      <tr>
        <td>${t.date}</td>
        <td>₹${t.amount}</td>
        <td><span class="badge bg-success">${t.status}</span></td>
      </tr>
    `).join('');
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="3" class="text-danger">Could not load history</td></tr>';
  }
}

async function rechargeNow() {
  const amount = document.getElementById('rechargeAmount').value;
  const msg = document.getElementById('rechargeMsg');

  if (!amount || amount <= 0) {
    msg.innerText = "Enter a valid amount";
    return;
  }

  const orderRes = await fetch(`${API}/wallet/create-order?amount=${amount}&user_id=${userId}`, {
    method: 'POST'
  });
  const order = await orderRes.json();

  const options = {
    key: "rzp_test_TjNgzn7tANxKdo",
    amount: order.amount,
    currency: "INR",
    name: "Payben",
    description: "Wallet Recharge",
    order_id: order.id,
    handler: async function (response) {
      const verifyRes = await fetch(`${API}/wallet/verify-payment?razorpay_order_id=${response.razorpay_order_id}&razorpay_payment_id=${response.razorpay_payment_id}&razorpay_signature=${response.razorpay_signature}&user_id=${userId}&amount=${amount}`, {
        method: 'POST'
      });
      const result = await verifyRes.json();

      if (verifyRes.ok) {
        msg.classList.remove('text-danger');
        msg.classList.add('text-success');
        msg.innerText = "Payment successful!";
        loadBalance();
        loadTransactions();
      } else {
        msg.innerText = result.detail || "Verification failed";
      }
    },
    theme: { color: "#4e54c8" }
  };

  const rzp = new Razorpay(options);
  rzp.open();
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user_id');
  window.location.href = 'index.html';
}

init();
</script>

</body>
</html>
