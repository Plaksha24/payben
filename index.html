<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payben - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { width: 380px; }
</style>
</head>
<body>

<div class="card shadow p-4">
  <h3 class="text-center mb-3">💳 Payben</h3>

  <ul class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#loginTab">Login</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#registerTab">Register</button>
    </li>
  </ul>

  <div class="tab-content">

    <!-- LOGIN -->
    <div class="tab-pane fade show active" id="loginTab">
      <div class="mb-2">
        <input type="email" id="loginEmail" class="form-control" placeholder="Email">
      </div>
      <div class="mb-2">
        <input type="password" id="loginPassword" class="form-control" placeholder="Password">
      </div>
      <button class="btn btn-primary w-100" onclick="login()">Login</button>
      <div id="loginMsg" class="text-danger mt-2 small"></div>
    </div>

    <!-- REGISTER -->
    <div class="tab-pane fade" id="registerTab">
      <div class="mb-2">
        <input type="text" id="regName" class="form-control" placeholder="Full Name">
      </div>
      <div class="mb-2">
        <input type="email" id="regEmail" class="form-control" placeholder="Email">
      </div>
      <div class="mb-2">
        <input type="password" id="regPassword" class="form-control" placeholder="Password">
      </div>
      <button class="btn btn-success w-100" onclick="register()">Register</button>
      <div id="regMsg" class="text-danger mt-2 small"></div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = "http://localhost:8000";

async function login() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');

  try {
    const res = await fetch(`${API}/login?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`, {
      method: 'POST'
    });
    const data = await res.json();

    if (res.ok) {
      localStorage.setItem('token', data.access_token);
      localStorage.setItem('user_id', data.user_id);
      window.location.href = 'dashboard.html?email=' + encodeURIComponent(email);
    } else {
      msg.innerText = data.detail || "Login failed";
    }
  } catch (err) {
    msg.innerText = "Could not connect to server";
  }
}

async function register() {
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  const msg = document.getElementById('regMsg');

  try {
    const res = await fetch(`${API}/register?name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`, {
      method: 'POST'
    });
    const data = await res.json();

    if (res.ok) {
      msg.classList.remove('text-danger');
      msg.classList.add('text-success');
      msg.innerText = "Registered! Now login.";
    } else {
      msg.classList.add('text-danger');
      msg.innerText = data.detail || "Registration failed";
    }
  } catch (err) {
    msg.innerText = "Could not connect to server";
  }
}
</script>

</body>
</html>
